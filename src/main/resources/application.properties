# Variables de entorno: se leen del sistema o de un archivo .env en la raiz del proyecto (ver .env.example)
spring.config.import=optional:file:.env[.properties]

spring.application.name=Amazonia Online Store

spring.datasource.url = jdbc:mysql://localhost:3306/amazonia
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql = true

jwt.secret.key = ${JWT_SECRET_KEY}
jwt.expiration.time = 86400000
